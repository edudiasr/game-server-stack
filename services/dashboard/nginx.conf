server {
    listen 80;
    root /usr/share/nginx/html;

    # o painel chama /api/monitor e /api/ranking na mesma origem; o Nginx repassa
    location /api/monitor/ {
        proxy_pass http://monitor:9105/;
    }

    # Server-Sent Events: sem buffer (senão os eventos chegam em lote) e conexão longa
    location = /api/ranking/stream {
        proxy_pass http://ranking:8000/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ranking/ {
        proxy_pass http://ranking:8000/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";  # nome com hash
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
